services:
  - type: web
    name: aceromax
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /css/*
        name: Cache-Control
        value: public, max-age=31536000
      - path: /images/*
        name: Cache-Control
        value: public, max-age=31536000
    routes:
      - type: rewrite
        source: /acero-estructural
        destination: /acero-estructural/index.html
      - type: rewrite
        source: /ptr-perfiles
        destination: /ptr-perfiles/index.html
      - type: rewrite
        source: /laminas
        destination: /laminas/index.html
